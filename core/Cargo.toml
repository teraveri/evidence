[package]
name = "evidence-core"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/teraveri/evidence"
description = "Wire-bound SNP, HCL, and vTPM evidence checks"

[dependencies]
evidence-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.13"
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }

[dev-dependencies]
openssl = { version = "0.10", features = ["vendored"] }
hex = "0.4"
